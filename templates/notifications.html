{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-12 flex-grow">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight">Notifications</h1>
            <p class="text-xs sm:text-sm font-semibold text-gray-400 mt-1">Review collaborative list invitations and system updates.</p>
        </div>
    </div>

    <div id="notifications-list-container" class="space-y-4">
        <!-- Dynamically populated by main.js -->
        <div class="bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-3xl p-8 text-center text-gray-400 font-medium text-sm">
            Loading notifications...
        </div>
    </div>
</div>
{% endblock %}
