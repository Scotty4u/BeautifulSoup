{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto py-16 px-4 text-center">
    <h1 class="text-3xl font-black text-gray-900 dark:text-white mb-2">Where do you usually shop?</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mb-8">Select your preferred grocery retailers to customize your comparison experience.</p>
    
    <form method="POST" class="grid grid-cols-2 gap-4">
        <!-- Checkers Card -->
        <label class="relative cursor-pointer border border-gray-200 dark:border-gray-800 rounded-3xl p-6 transition-all duration-200 flex flex-col items-center justify-center bg-white dark:bg-gray-900 hover:border-emerald-500/50 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30 dark:has-[:checked]:bg-emerald-950/20 shadow-sm">
            <input type="checkbox" name="preferred_stores" value="Checkers" class="sr-only peer">
            <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-emerald-600 text-white items-center justify-center hidden peer-checked:flex shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <span class="font-black text-gray-900 dark:text-white text-base mt-2">Checkers</span>
        </label>

        <!-- Pick n Pay Card -->
        <label class="relative cursor-pointer border border-gray-200 dark:border-gray-800 rounded-3xl p-6 transition-all duration-200 flex flex-col items-center justify-center bg-white dark:bg-gray-900 hover:border-emerald-500/50 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30 dark:has-[:checked]:bg-emerald-950/20 shadow-sm">
            <input type="checkbox" name="preferred_stores" value="Pick n Pay" class="sr-only peer">
            <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-emerald-600 text-white items-center justify-center hidden peer-checked:flex shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <span class="font-black text-gray-900 dark:text-white text-base mt-2">Pick n Pay</span>
        </label>

        <!-- Shoprite Card -->
        <label class="relative cursor-pointer border border-gray-200 dark:border-gray-800 rounded-3xl p-6 transition-all duration-200 flex flex-col items-center justify-center bg-white dark:bg-gray-900 hover:border-emerald-500/50 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30 dark:has-[:checked]:bg-emerald-950/20 shadow-sm">
            <input type="checkbox" name="preferred_stores" value="Shoprite" class="sr-only peer">
            <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-emerald-600 text-white items-center justify-center hidden peer-checked:flex shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <span class="font-black text-gray-900 dark:text-white text-base mt-2">Shoprite</span>
        </label>

        <!-- Woolworths Card -->
        <label class="relative cursor-pointer border border-gray-200 dark:border-gray-800 rounded-3xl p-6 transition-all duration-200 flex flex-col items-center justify-center bg-white dark:bg-gray-900 hover:border-emerald-500/50 has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50/30 dark:has-[:checked]:bg-emerald-950/20 shadow-sm">
            <input type="checkbox" name="preferred_stores" value="Woolworths" class="sr-only peer">
            <div class="absolute top-3 right-3 w-6 h-6 rounded-full bg-emerald-600 text-white items-center justify-center hidden peer-checked:flex shadow-sm">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <span class="font-black text-gray-900 dark:text-white text-base mt-2">Woolworths</span>
        </label>
        
        <button type="submit" class="col-span-2 mt-4 bg-brand-dark hover:bg-black dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl transition cursor-pointer shadow-sm">
            Continue to Smart Basket
        </button>
    </form>
</div>
{% endblock %}
