{% extends "base.html" %}

{% block content %}
<section class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-grow">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 sm:mb-8 pb-4 border-b border-gray-200 dark:border-gray-800 gap-4">
        <div>
            <h1 class="text-2xl sm:text-3xl font-black text-gray-900 dark:text-white tracking-tight">Saved Baskets 📦</h1>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400 mt-1">Access, inspect, or reload your previously saved grocery lists.</p>
        </div>
        <a href="{{ url_for('home') }}" class="inline-flex items-center justify-center space-x-2 text-gray-600 dark:text-gray-300 hover:text-brand-dark font-bold text-sm transition cursor-pointer bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 px-4 py-2.5 rounded-xl shadow-2xs hover:bg-gray-50 dark:hover:bg-gray-800">
            <span>&larr; Continue Shopping</span>
        </a>
    </div>

    <!-- Container for dynamic list rendered by JS -->
    <div id="saved-baskets-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</section>
{% endblock %}
