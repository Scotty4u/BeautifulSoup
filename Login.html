<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasi Hub</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    
    <div style="justify-items: center; margin-top: -50px;">
      <div class="login-card-logo">
        <div class="logo" style="margin-top: 30px; margin-bottom: 5px; display: grid; justify-items: center;">
          <i class="fas fa-shopping-bag" style="font-size: 70px; color: #2563eb;"></i>
          <span style="margin-top: 5%; color: black; font-weight: bolder; font-size: 30px;">Smart Basket</span>
        </div>
        <div style="justify-items: center;">
            <br></br>
          <h3 class="sign-text">Sign in</h3>
          <p style="font-size: 15px;">Welcome back! Please sign in to your account</p>
        </div>
        <br></br>
        <div></div>
        <div class="Content">
          <div class="tab">
            <label for="email" style="font-size: 13px;"> Email Address</label>
            <input
              class="Username-box"
              type="email"
              placeholder="Enter your email address"
              style="margin-top: 5px"
              required
            />
          </div>

          <div class="tab">
            <label for="password" style="font-size: 13px;"> Password</label>
            <input
              class="Username-box"
              type="password"
              placeholder="Enter your password"
              style="margin-top: 5px"
              required
            />
          </div>
          <div><button id="log-btn" style="margin-bottom: 10px;">Login</button></div>
        </div>
        <div><p class="Text-sign-page">OR</p></div>
        <div style="margin-top: -4px;"><button id="google-btn"> Sign in with Google <img src="imgs/google.png" alt=""></button></div>
        <br></br>
        <p style="font-size: 15px;">
          Don't have an Account?? <strong><u style="color: #2563eb ;">Sign up</u></strong>
        </p>
      </div>
    </div>
  </body>
</html>
