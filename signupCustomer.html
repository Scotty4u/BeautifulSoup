<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="Css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>
  <body>
    <div style="justify-items: center; margin-top: -80px;">
        <div class="Sign-up-container" style=" max-height: 100%; height: 900px;">
        <div class="logo" style="margin-top: 30px; margin-bottom: 5px; display: grid; justify-items: center;">
          <i class="fas fa-shopping-bag" style="font-size: 70px; color: #2563eb;"></i>
          <span style="margin-top: 5%; color: black; font-weight: bolder; font-size: 30px;">Smart Basket</span>
        </div>
          <div style="justify-items: center;">
        <br></br>
        <h3 class="sign-text">Sign up as Customer</h3>
        <p style="font-size: 15px;">Enter your details to create your personal account</p>
        <br></br>
        
      </div>
      <div style="justify-items: center;">
        <div><label for="name" style="font-size: 13px;">Full Name </label>
        <input class="Username-box2" type="text" placeholder="Enter your full name" /></div>
        <div style="margin-top: 10px;"><label for="name" style="font-size: 13px;">Last Name </label>
        <input class="Username-box2" type="text" placeholder="Enter your full name" /></div>
        <div style="margin-top: 10px;"><label for="name" style="font-size: 13px;">Email address </label>
        <input class="Username-box2" type="email" placeholder="Enter your email address" /></div>
        <div style="margin-top: 10px;"><label for="name" style="font-size: 13px;">Password </label>
        <input class="Username-box2" type="password" placeholder="Create a password" /></div>
        <div style="margin-top: 10px;"><label for="name" style="font-size: 13px;">Confirm password </label>
        <input class="Username-box2" type="text" placeholder="Confirm your password" /></div>

        
        
        <br></br>
        <div class="form-check">
          <label class="form-check-label">
            <input type="checkbox" class="form-check-input" name="" id="" value="checkedValue" >
            I agree to the<strong style="color: #2563eb "> Terms of service</strong> and <strong style="color: #2563eb ">Privacy Policy</strong>
          </label>
        </div>
        <div style="justify-items: center;">
        <button id="signup-btn">Sign up</button>
        <br></br>
        <p class="Text-sign-page" style="margin-top: 10px;">OR</p>
        <button id="google-btn" >Sign up with Google <img src="imgs/google.png" alt=""></button></div>
        <br></br>
        <div class="end-tab">
        <div><p class="Text-sign-page">Already have an account? <strong style="color: #2563eb "><u>Log in </u><strong></p></div>
    </div>
      </div>
    </div>
    </div>
  </body>
</html>
